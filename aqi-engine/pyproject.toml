[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airatlas-aqi"
version = "0.1.0"
description = "Pluggable multi-standard AQI engine (CPCB NAQI, UBA LQI, EEA EAQI, UAE EAQI, WHO 2021)"
requires-python = ">=3.11"
dependencies = []  # stdlib only: ingestion, ML and API all import this

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airatlas_aqi = ["tables/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
