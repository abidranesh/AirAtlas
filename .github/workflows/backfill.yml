name: backfill

# Manual and resumable: each run continues backwards from where the previous one stopped.
on:
  workflow_dispatch:
    inputs:
      region:
        type: choice
        options: [tamil_nadu, kerala, uae, germany]
      source:
        type: choice
        options: [openaq, uba, open_meteo, firms, events]
      kind:
        description: "hourly (raw, max 90 days) | daily (openaq/uba) | weather_daily (open_meteo; 1 year per run)"
        type: choice
        options: [hourly, daily, weather_daily]
        default: hourly
      days:
        type: number
        default: 90

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: backfill-${{ inputs.region }}-${{ inputs.source }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      OPENAQ_RPM: "30"   # leave room for the hourly jobs sharing the key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e ./aqi-engine -e "./ingestion[eea]"
      - run: python -m airatlas_ingest migrate
      - if: inputs.source == 'events'
        run: python -m airatlas_ingest backfill-events --region ${{ inputs.region }}
      - if: inputs.source != 'events'
        run: >
          python -m airatlas_ingest backfill --region ${{ inputs.region }} --source ${{ inputs.source }}
          --kind ${{ inputs.kind }} --days ${{ inputs.days }}
