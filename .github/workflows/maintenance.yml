name: maintenance

# Daily: aggregates, festival archive, retention (drop week partitions > 90 days), storage stats.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: maintenance
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e ./aqi-engine -e ./ingestion
      - run: python -m airatlas_ingest migrate
      - run: python -m airatlas_ingest maintenance

  # GitHub disables schedules in public repos after 60 days without repository activity.
  # Re-enabling through the API keeps them alive without dummy commits.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in ingest-hourly.yml ingest-modeled.yml maintenance.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY"
          done
