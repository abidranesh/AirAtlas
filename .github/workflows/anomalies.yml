name: anomalies

# Re-detect pollution spikes (and their cause hints) for episodes ending in the last N days.
# Runs after the 3-hourly modeled/fire ingestion so wind, dust and fire evidence is current.
on:
  schedule:
    - cron: "55 */3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Re-detect episodes ending in the last N days (max 85 with 90-day raw retention)"
        type: number
        default: 10

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        region: [tamil_nadu, kerala, uae, germany]
    concurrency:
      group: anomalies-${{ matrix.region }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/pyproject.toml"}
      - run: pip install -e ./aqi-engine -e ./ingestion -e ./ml
      - run: python -m airatlas_ingest migrate
      - run: python -m airatlas_ml detect --region ${{ matrix.region }} --days ${{ inputs.days || 10 }}
