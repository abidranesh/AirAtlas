name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e "./aqi-engine[dev]" -e "./ingestion[dev,eea]" -e "./api[dev]" -e "./ml[dev]"
      - name: AQI engine
        working-directory: aqi-engine
        run: python -m pytest -q
      - name: Ingestion (unit + Postgres integration)
        working-directory: ingestion
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q
      - name: ML (anomaly detection + cause hints; job against Postgres)
        working-directory: ml
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q
      - name: API (unit + endpoint tests against Postgres)
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q
      - name: Vercel build step works (vendors the engine)
        working-directory: api
        run: python vendor_engine.py && python -c "import airatlas_aqi, app; print('ok')"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
