name: ingest-hourly

# Measured sources, one job per region so a failure in one region never blocks the others.
# :17 avoids the top-of-hour congestion when GitHub delays scheduled runs.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        region: [tamil_nadu, kerala, uae, germany]
    concurrency:
      group: hourly-${{ matrix.region }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      OPENAQ_RPM: "18"   # 3 regions share one OpenAQ key (60 req/min)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e ./aqi-engine -e ./ingestion
      - run: python -m airatlas_ingest migrate
      - run: python -m airatlas_ingest hourly --region ${{ matrix.region }}
