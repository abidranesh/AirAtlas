[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airatlas-ml"
version = "0.1.0"
description = "AirAtlas anomaly detection with cause hints (and, in Phase 9, forecasting)"
requires-python = ">=3.11"
dependencies = ["airatlas-ingest", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs TEST_DATABASE_URL (Postgres + PostGIS)"]
