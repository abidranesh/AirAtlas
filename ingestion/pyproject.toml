[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airatlas-ingest"
version = "0.1.0"
description = "AirAtlas ingestion: one adapter per data source, run per region by GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "airatlas-aqi",
    "httpx>=0.27",
    "pydantic>=2.6",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
eea = ["pyarrow>=15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs TEST_DATABASE_URL (Postgres + PostGIS)"]
